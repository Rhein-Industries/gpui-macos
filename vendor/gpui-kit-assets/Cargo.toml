# Pinned GPUI Kit source; workspace dependencies normalized locally.

[package]
name = "gpui-macos-assets"
description = "The gpui-macos pinned fork of gpui-kit-assets."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
license = "Apache-2.0 AND ISC AND MIT"
documentation = "https://docs.rs/gpui-macos-assets"
homepage = "https://github.com/Rhein-Industries/gpui-macos"
repository = "https://github.com/Rhein-Industries/gpui-macos"
readme = "README.md"
edition = "2024"
publish = ["crates-io"]
version = "0.7.1-macos.1"
links = "gpui-kit-default-icons"

[package.metadata]

[package.metadata.gpui-macos-fork]
upstream-package = "gpui-kit-assets"
upstream-version = "0.7.1"
upstream-revision = "0bbd9870ce420af9feacbf948b21d3824d82dc0b"
upstream-source = "https://github.com/longbridge/gpui-kit"

[package.metadata.docs]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[dependencies]

[dependencies.anyhow]
version = "1"

[dependencies.gpui]
package = "gpui-pre"
version = "=0.3.8"

[dependencies.gpui-fast]
package = "gpui-fast"
version = "0.1.3"
features = ["windows-manifest-provided-by-host"]
optional = true

[dependencies.log]
version = "0.4"

[dev-dependencies]

[dev-dependencies.gpui_platform]
package = "gpui-pre-platform"
version = "=0.3.8"
features = ["font-kit", "x11", "wayland", "runtime_shaders"]

[dev-dependencies.gpui-fast-platform]
package = "gpui-fast-platform"
version = "0.1.3"
features = ["font-kit", "x11", "wayland", "runtime_shaders"]

[target]

[target."cfg(not(target_family = \"wasm\"))"]

[target."cfg(not(target_family = \"wasm\"))".dependencies]

[target."cfg(not(target_family = \"wasm\"))".dependencies.rust-embed]
version = "8.7.2"
features = ["interpolate-folder-path", "include-exclude", "debug-embed"]

[target."cfg(target_family = \"wasm\")"]

[target."cfg(target_family = \"wasm\")".dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target."cfg(target_family = \"wasm\")".dependencies.reqwest]
package = "gpui-pre-reqwest"
version = "=0.12.15"
default-features = false
features = ["charset", "http2", "macos-system-configuration", "multipart", "rustls-tls-native-roots", "socks", "stream"]

[features]
gpui-fast = ["dep:gpui-fast"]

[lib]
name = "gpui_kit_assets"
