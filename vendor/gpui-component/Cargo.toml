resvg = "0.45.1"

[target."cfg(target_os = \"windows\")".dependencies.raw-window-handle]
version = "0.6.2"

[target."cfg(target_os = \"windows\")".dependencies.windows]
features = ["Wdk", "Wdk_System", "Wdk_System_SystemServices", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_GdiPlus", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"]
version = "0.58.0"

[dev-dependencies]
indoc = "2"

[dev-dependencies.gpui]
package = "gpui-pre"
version = "=0.3.8"
features = ["test-support"]

[dev-dependencies.gpui-fast]
package = "gpui-fast"
version = "0.1.3"
features = ["windows-manifest-provided-by-host", "test-support"]

[lints]

[lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"

[lints.clippy.style]
level = "allow"
priority = -1
