[target."cfg(target_os = \"macos\")"]

[target."cfg(target_os = \"macos\")".dependencies]
core-text = "=21.0.0"
objc2 = "0.6"

[target."cfg(target_os = \"macos\")".dependencies.raw-window-handle]
version = "0.6.2"

[target."cfg(target_os = \"macos\")".dependencies.objc2-app-kit]
version = "0.3"
features = ["NSMenu", "NSMenuItem", "NSView", "NSWindow", "NSResponder", "NSEvent", "NSImage"]

[target."cfg(target_os = \"macos\")".dependencies.objc2-foundation]
version = "0.3"
features = ["NSData", "NSString", "NSGeometry"]

[target."cfg(target_os = \"macos\")".dependencies.block2]
version = "0.6"
optional = true

[target."cfg(target_os = \"macos\")".dependencies.objc2-av-foundation]
version = "0.3"
default-features = false
features = ["std", "AVCaptureDevice", "AVMediaFormat"]
optional = true

[target."cfg(target_os = \"macos\")".dependencies.objc2-avf-audio]
version = "0.3"
default-features = false
features = ["std", "AVAudioBuffer", "AVAudioFormat", "AVAudioTypes"]
optional = true

[target."cfg(target_os = \"macos\")".dependencies.objc2-speech]
version = "0.3"
default-features = false
features = ["std", "block2", "objc2-avf-audio", "SFSpeechRecognitionMetadata", "SFSpeechRecognitionRequest", "SFSpeechRecognitionResult", "SFSpeechRecognitionTask", "SFSpeechRecognizer", "SFTranscription"]
optional = true

[target."cfg(target_os = \"windows\")"]

