# Pinned GPUI Kit source; workspace dependencies normalized locally.

[package]
name = "gpui-macos-kit"
version = "0.7.1-macos.1"
description = "The gpui-macos pinned fork of gpui-kit."
keywords = ["desktop", "gpui", "shadcn", "ui", "uikit"]
categories = ["gui"]
license = "Apache-2.0"
documentation = "https://docs.rs/gpui-macos-kit"
homepage = "https://github.com/Rhein-Industries/gpui-macos"
repository = "https://github.com/Rhein-Industries/gpui-macos"
readme = "README.md"
publish = ["crates-io"]
edition = "2024"

[package.metadata]

[package.metadata.gpui-macos-fork]
upstream-package = "gpui-kit"
upstream-version = "0.7.1"
upstream-revision = "0bbd9870ce420af9feacbf948b21d3824d82dc0b"
upstream-source = "https://github.com/longbridge/gpui-kit"

[package.metadata.docs]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[lints]

[lints.clippy]
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
dbg_macro = "deny"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
todo = "deny"
type_complexity = "allow"
useless_conversion = "allow"

[lints.clippy.style]
level = "allow"
priority = -1

[features]
default = ["component", "assets"]
gpui-fast = ["dep:gpui-fast", "dep:gpui-fast-platform", "dep:gpui-fast-web", "gpui-base/gpui-fast", "gpui-component?/gpui-fast", "gpui-kit-assets?/gpui-fast"]
component = ["dep:gpui-component"]
assets = ["dep:gpui-kit-assets"]
test-support = ["gpui/test-support", "gpui_platform/test-support", "gpui-base/test-support", "gpui-component?/test-support", "gpui-fast?/test-support", "gpui-fast-platform?/test-support"]
profiler = ["gpui/profiler", "gpui-fast?/profiler"]
inspector = ["gpui/inspector", "gpui-base/inspector", "gpui-component?/inspector", "gpui-fast?/inspector"]
decimal = ["component", "gpui-component/decimal"]
speech = ["component", "gpui-component/speech"]
tree-sitter = ["component", "gpui-component/tree-sitter"]
tree-sitter-languages = ["component", "gpui-component/tree-sitter-languages"]
tree-sitter-astro = ["component", "gpui-component/tree-sitter-astro"]
tree-sitter-bash = ["component", "gpui-component/tree-sitter-bash"]
tree-sitter-c = ["component", "gpui-component/tree-sitter-c"]
tree-sitter-cmake = ["component", "gpui-component/tree-sitter-cmake"]
tree-sitter-cpp = ["component", "gpui-component/tree-sitter-cpp"]
tree-sitter-csharp = ["component", "gpui-component/tree-sitter-csharp"]
tree-sitter-css = ["component", "gpui-component/tree-sitter-css"]
tree-sitter-diff = ["component", "gpui-component/tree-sitter-diff"]
tree-sitter-ejs = ["component", "gpui-component/tree-sitter-ejs"]
tree-sitter-elixir = ["component", "gpui-component/tree-sitter-elixir"]
tree-sitter-erb = ["component", "gpui-component/tree-sitter-erb"]
tree-sitter-go = ["component", "gpui-component/tree-sitter-go"]
tree-sitter-graphql = ["component", "gpui-component/tree-sitter-graphql"]
tree-sitter-html = ["component", "gpui-component/tree-sitter-html"]
tree-sitter-java = ["component", "gpui-component/tree-sitter-java"]
tree-sitter-javascript = ["component", "gpui-component/tree-sitter-javascript"]
tree-sitter-jsdoc = ["component", "gpui-component/tree-sitter-jsdoc"]
tree-sitter-kotlin = ["component", "gpui-component/tree-sitter-kotlin"]
tree-sitter-lua = ["component", "gpui-component/tree-sitter-lua"]
tree-sitter-make = ["component", "gpui-component/tree-sitter-make"]
tree-sitter-markdown = ["component", "gpui-component/tree-sitter-markdown"]
tree-sitter-markdown-inline = ["component", "gpui-component/tree-sitter-markdown-inline"]
tree-sitter-php = ["component", "gpui-component/tree-sitter-php"]
tree-sitter-proto = ["component", "gpui-component/tree-sitter-proto"]
tree-sitter-python = ["component", "gpui-component/tree-sitter-python"]
tree-sitter-ruby = ["component", "gpui-component/tree-sitter-ruby"]
tree-sitter-rust = ["component", "gpui-component/tree-sitter-rust"]
tree-sitter-scala = ["component", "gpui-component/tree-sitter-scala"]
tree-sitter-sql = ["component", "gpui-component/tree-sitter-sql"]
tree-sitter-svelte = ["component", "gpui-component/tree-sitter-svelte"]
tree-sitter-swift = ["component", "gpui-component/tree-sitter-swift"]
tree-sitter-toml = ["component", "gpui-component/tree-sitter-toml"]
tree-sitter-tsx = ["component", "gpui-component/tree-sitter-tsx"]
tree-sitter-typescript = ["component", "gpui-component/tree-sitter-typescript"]
tree-sitter-yaml = ["component", "gpui-component/tree-sitter-yaml"]
tree-sitter-zig = ["component", "gpui-component/tree-sitter-zig"]

[dependencies]

[dependencies.gpui_macros]
package = "gpui-pre-macros"
version = "=0.3.8"

[dependencies.gpui]
package = "gpui-pre"
version = "=0.3.8"

[dependencies.gpui-fast]
package = "gpui-fast"
version = "0.1.3"
features = ["windows-manifest-provided-by-host"]
optional = true

[dependencies.gpui-base]
path = "../gpui-base"
version = "=0.7.1-macos.1"
package = "gpui-macos-base"

[dependencies.gpui-component]
path = "../gpui-component"
version = "=0.7.1-macos.1"
optional = true
package = "gpui-macos-component"

[dependencies.gpui-kit-assets]
path = "../gpui-kit-assets"
version = "=0.7.1-macos.1"
optional = true
package = "gpui-macos-assets"

[target]

[target."cfg(not(any(target_os = \"ios\", target_os = \"android\")))"]

[target."cfg(not(any(target_os = \"ios\", target_os = \"android\")))".dependencies]

[target."cfg(not(any(target_os = \"ios\", target_os = \"android\")))".dependencies.gpui_platform]
package = "gpui-pre-platform"
version = "=0.3.8"
features = ["font-kit", "x11", "wayland", "runtime_shaders"]

[target."cfg(not(any(target_os = \"ios\", target_os = \"android\")))".dependencies.gpui-fast-platform]
package = "gpui-fast-platform"
version = "0.1.3"
features = ["font-kit", "x11", "wayland", "runtime_shaders"]
optional = true

[target."cfg(target_family = \"wasm\")"]

[target."cfg(target_family = \"wasm\")".dependencies]

[target."cfg(target_family = \"wasm\")".dependencies.gpui_web]
package = "gpui-pre-web"
version = "=0.3.8"

[target."cfg(target_family = \"wasm\")".dependencies.gpui-fast-web]
package = "gpui-fast-web"
version = "0.1.3"
optional = true

[dev-dependencies]
chrono = "0.4.38"

[dev-dependencies.gpui]
package = "gpui-pre"
version = "=0.3.8"
features = ["test-support"]

[dev-dependencies.gpui-fast]
package = "gpui-fast"
version = "0.1.3"
features = ["windows-manifest-provided-by-host", "test-support"]

[dev-dependencies.lsp-types]
version = "0.97.0"
features = ["proposed"]

[[test]]
name = "window"
required-features = ["test-support"]

[[test]]
name = "lifecycle"
required-features = ["test-support"]

[[test]]
name = "components"
required-features = ["test-support", "component"]

[[test]]
name = "input"
required-features = ["test-support", "component"]

[[test]]
name = "input_focus"
required-features = ["test-support", "component"]

[[test]]
name = "ui"
required-features = ["test-support", "component"]

[[test]]
name = "root"
required-features = ["test-support", "component"]

[[test]]
name = "controls"
required-features = ["test-support", "component"]

[[test]]
name = "interactions"
required-features = ["test-support"]

[[test]]
name = "event_helpers"
required-features = ["test-support"]

[[test]]
name = "query_helpers"
required-features = ["test-support"]

[[test]]
name = "composition_helpers"
required-features = ["test-support", "component"]

[[test]]
name = "environment"
required-features = ["test-support", "component"]

[[test]]
name = "control_steps"
required-features = ["test-support", "component"]

[[test]]
name = "slider_steps"
required-features = ["test-support", "component"]

[[test]]
name = "semantic_controls"
required-features = ["test-support", "component"]

[[test]]
name = "collection_steps"
required-features = ["test-support", "component"]

[[test]]
name = "rendering"
test = false
harness = false
required-features = ["test-support", "component", "assets"]

[[test]]
name = "disclosure"
required-features = ["test-support", "component"]

[[test]]
name = "overlays"
required-features = ["test-support", "component"]

[[test]]
name = "menu"
required-features = ["test-support", "component"]

[[test]]
name = "collections"
required-features = ["test-support", "component"]

[[test]]
name = "date_picker"
required-features = ["test-support", "component"]

[[test]]
name = "dock"
required-features = ["test-support", "component"]

[[test]]
name = "search"
required-features = ["assets", "test-support", "component"]

[[test]]
name = "touch_selection"
required-features = ["test-support", "component"]

[[test]]
name = "text_selection"
required-features = ["test-support", "component"]

[[test]]
name = "diff"
required-features = ["test-support", "component"]

[lib]
name = "gpui_kit"
