[package]
name = "gpui-macos"
version = "0.1.0"
edition = "2024"
license = "MIT AND Apache-2.0"
description = "A complete macOS design system for GPUI Kit: native controls, Liquid Glass surfaces, and desktop layouts."
keywords = ["gpui", "macos", "ui", "components", "desktop"]
categories = ["gui"]
exclude = ["artifacts/**"]
documentation = "https://docs.rs/gpui-macos"
repository = "https://github.com/Rhein-Industries/gpui-macos"
homepage = "https://github.com/Rhein-Industries/gpui-macos"
readme = "README.md"
publish = ["crates-io"]

[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []

[workspace]
members = ["vendor/gpui-kit", "vendor/gpui-base", "vendor/gpui-component", "vendor/gpui-component-macros", "vendor/gpui-kit-assets"]
default-members = ["."]
resolver = "3"

[features]
default = ["gpui-fast"]
gpui-fast = ["gpui-kit/gpui-fast"]
tree-sitter = ["gpui-kit/tree-sitter"]
tree-sitter-languages = ["tree-sitter", "gpui-kit/tree-sitter-languages"]
speech = ["gpui-kit/speech"]

[dependencies]
gpui-kit = { package = "gpui-macos-kit", path = "vendor/gpui-kit", version = "=0.7.1-macos.1", default-features = false, features = ["assets", "component"] }
chrono = "0.4.45"
itertools = "0.13"
num-traits = "0.2"
anyhow = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace"] }
block2 = "0.6"

[dev-dependencies]
serde_json = "1"
gpui-kit = { package = "gpui-macos-kit", path = "vendor/gpui-kit", version = "=0.7.1-macos.1", default-features = false, features = ["test-support"] }

[profile.dev]
debug = "limited"

[profile.release.package.gpui-pre-macros]
debug-assertions = true
